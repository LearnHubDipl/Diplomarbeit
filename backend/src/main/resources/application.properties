quarkus.package.type=uber-jar

# enable cors for angular
# ---- DEV (lokal) ----
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:4200
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
%dev.quarkus.http.cors.exposed-headers=location,link
%dev.quarkus.http.cors.access-control-allow-credentials=true

# ---- PROD (Server) ----
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=https://vm91.htl-leonding.ac.at
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
%prod.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
%prod.quarkus.http.cors.exposed-headers=location,link
%prod.quarkus.http.cors.access-control-allow-credentials=true

# Dev (default) - H2 in memory for local development
quarkus.datasource.devservices.enabled=true
quarkus.datasource.enabled=true
quarkus.hibernate-orm.enabled=true

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create


# Prod: Dockerized MySQL
%prod.quarkus.datasource.db-kind=mysql
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/learnhub-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus
%prod.quarkus.hibernate-orm.database.generation=update

# Enable OpenAPI and Swagger UI in prod
%prod.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.path=/q/swagger-ui
%prod.quarkus.smallrye-openapi.path=/q/openapi
%prod.quarkus.smallrye-openapi.enable=true
%prod.quarkus.smallrye-openapi.yaml-code-point-limit=10000000
%prod.quarkus.http.limits.max-body-size=100M

app.upload.dir=/app/uploads
app.public.base=http://vm91.htl-leonding.ac.at/uploads/
quarkus.http.limits.max-body-size=25M

%dev.quarkus.http.auth.permission.public.paths=/*
%dev.quarkus.http.auth.permission.public.policy=permit

%prod.quarkus.http.auth.permission.api.paths=/api/*
%prod.quarkus.http.auth.permission.api.policy=permit
%prod.quarkus.http.auth.permission.uploads.paths=/uploads/*
%prod.quarkus.http.auth.permission.uploads.policy=permit

