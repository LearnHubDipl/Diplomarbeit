<div class="exam-list">
  <div *ngFor="let exam of exams" class="exam-item">

    <div class="exam-header" (click)="toggleExam(exam.id)">
      <div class="header-left">
        <strong class="score-display">{{ Math.floor(exam.score) }}%</strong>

        <div class="subject-tags">
          <span *ngFor="let name of exam.subjectNames" class="tag">
            {{ name }}
          </span>
        </div>
      </div>

      <div class="header-right">
        <span class="duration">{{ formatDuration(exam) }}</span>
        <span class="date">{{ exam.startedAt | date:'dd.MM.yyyy' }}</span>

        <span class="arrow">
          {{ expandedExamId === exam.id ? '▲' : '▼' }}
        </span>
      </div>
    </div>

    <div *ngIf="expandedExamId === exam.id" class="exam-detail">
      <ng-container *ngIf="selectedExamDetails && selectedExamDetails.id === exam.id">
        <lib-question-runner
          mode="review"
          [exam]="$any(selectedExamDetails)"
          [navigateBack]="false">
        </lib-question-runner>
      </ng-container>
    </div>
    </div>
  </div>
</div>
