<div *ngIf="!isLoading && exam && !examSubmitted">
  <lib-question-runner
    mode="exam"
    [questionIdList]="this.questionIds"
    (answered)="storeAnswer($event)"
    (finishedExam)="submitExam($event)">
  </lib-question-runner>
</div>

<div *ngIf="!isLoading && submittedExam && examSubmitted">
  <lib-question-runner
    mode="review"
    [exam]="this.submittedExam">
  </lib-question-runner>
</div>

<div *ngIf="isLoading">
  <p>Prüfung wird erstellt...</p>
</div>
