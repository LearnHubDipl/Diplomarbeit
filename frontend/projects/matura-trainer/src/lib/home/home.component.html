<div class="stats-layout">
  <div class="widget-wrapper">
    <div class="header">Fortschritt</div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div *ngFor="let level of progressLevels" class="progress-level">
          <h3>{{ level.title }}</h3>
          <div class="progress-bar-wrapper">
            <div *ngFor="let entry of level.entries"
                 class="progress-segment"
                 [style.background]="entry.color"
                 [style.width.%]="entry.value > 0 ? entry.value * 10 : 0">
            </div>
          </div>
          <div *ngFor="let entry of level.entries" class="progress-description">
            <span class="dot" [style.background]="entry.color"></span>
            {{ entry.description }}
          </div>
        </div>
      </div>

      <div class="selection-container">
        <div class="thempool-container">
          <label class="label">Themenpools wählen:</label>

          <div class="checkbox-list">
            <div *ngFor="let pool of topicPools" class="checkbox-item">
              <input
                type="checkbox"
                [id]="'pool-' + pool.id"
                [checked]="selectedTopicPoolIds.has(pool.id)"
                (change)="toggleTopicPool(pool.id)">
              <label [for]="'pool-' + pool.id">{{ pool.name }}</label>
            </div>
          </div>

          <button class="action-button"
                  (click)="startPractice()"
                  [disabled]="!hasQuestions"
                  [class.button-disabled]="!hasQuestions">
            {{ hasQuestions ? 'Üben' : 'Nichts fällig' }}
          </button>

          <div *ngIf="selectedTopicPoolIds.size > 0 && !hasQuestions" class="no-questions-msg">
            Alle Fragen in dieser Auswahl sind momentan gelernt. Komm später wieder!
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
