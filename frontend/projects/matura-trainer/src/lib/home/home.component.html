<div class="stats-layout">
  <div class="widget-wrapper">
    <div class="header">Fortschritt</div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div *ngFor="let level of progressLevels; trackBy: trackByTitle" class="progress-level">
          <h3>{{ level.title }}</h3>

          <div class="progress-bar-wrapper">
            <div *ngFor="let entry of level.entries"
                 class="progress-segment"
                 [style.background]="entry.color"
                 [style.width.%]="entry.value > 0 ? entry.value / this.questionPool?.entries!.length * 100 : 0">
            </div>
          </div>

          <div class="legend-container">
            <div *ngFor="let entry of level.entries" class="progress-description">
              <span class="dot" [style.background]="entry.color"></span>
              {{ entry.description }}
            </div>
          </div>
        </div>
      </div>

      <div class="selection-container">
        <div class="thempool-container">
          <label class="label">Themenpools wählen:</label><br>

          <mat-form-field class="thempool-dropdown-menu" appearance="outline">
            <mat-label>Fächer und Themenpools</mat-label>
            <mat-select [formControl]="topicPoolControl" multiple>
              <mat-select-trigger>
                {{ getSelectedSubjectNames().join(', ') }}
              </mat-select-trigger>

              <mat-optgroup *ngFor="let subject of subjects" [label]="''">
                <div class="subject-header">
                  <span class="subject-label">{{ subject.name }}</span>
                  <mat-checkbox
                    [checked]="isSubjectSelected(subject)"
                    (change)="toggleSubject(subject, $event.checked)"
                    (click)="$event.stopPropagation()">
                  </mat-checkbox>
                </div>

                <mat-option style="margin-left: 4%" *ngFor="let pool of subject.topicPools" [value]="pool.id">
                  <span class="topic-pool-name">{{ pool.name }}</span>
                </mat-option>
              </mat-optgroup>
            </mat-select>
          </mat-form-field><br>

          <button class="action-button"
                  (click)="startPractice()"
                  [disabled]="!hasQuestions"
                  [class.button-disabled]="!hasQuestions">
            {{ hasQuestions ? 'Üben' : 'Nichts fällig' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
