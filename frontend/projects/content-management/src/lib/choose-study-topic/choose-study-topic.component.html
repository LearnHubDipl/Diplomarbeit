<div class="container mt-5 mb-4">
  <nav aria-label="breadcrumb" class="mb-4" style="--bs-breadcrumb-divider: '>';">
    <ol class="breadcrumb fs-5 fw-semibold">
      <li class="breadcrumb-item">
        <a routerLink="/study/choose" class="text-dark text-decoration-none">
          <i class="bi bi-journal-bookmark me-1"></i>
          Erstellen & Lernen
        </a>
      </li>
      <li class="breadcrumb-item active text-orange fw-bold" aria-current="page">
        Fachauswahl
      </li>
    </ol>
  </nav>
  <h2 class="fw-bold text-warning">Lernbereich starten</h2>
  <p class="text-muted">Wähle ein Fach und dann einen Themenpool</p>

  <div class="btn-group mb-4" role="group">
    <button type="button"
            class="btn hover-white"
            [ngClass]="{
            'btn-warning': isPublicMode,
            'btn-outline-warning': !isPublicMode,
            'text-white': isPublicMode
          }"
            (click)="isPublicMode = true; checkQuestionsAvailability()">
      <i class="bi bi-globe me-1"></i>
      Öffentlich
    </button>
    <button type="button"
            class="btn hover-white"
            [ngClass]="{
            'btn-warning': !isPublicMode,
            'btn-outline-warning': isPublicMode,
            'text-white': !isPublicMode
          }"
            (click)="isPublicMode = false; checkQuestionsAvailability()">
      <i class="bi bi-person me-1"></i>
      Persönlich
    </button>
  </div>

  <div *ngIf="loadError" class="alert alert-danger mt-3">
    <strong>Fächer konnten nicht geladen werden</strong><br>
    {{ errorMessage }}
  </div>

  <div id="accordionSubjects">
    <div *ngFor="let subject of filteredSubjects" class="mb-2 border rounded overflow-hidden">
      <div class="bg-warning text-white p-3 d-flex justify-content-between align-items-center"
           style="cursor: pointer;"
           (click)="toggleSubject(subject.id)">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-folder2-open fs-5 me-2"></i>
          <span class="fs-5">{{ subject.name }}</span>
        </div>
        <i class="bi fs-4" [ngClass]="{
             'bi-chevron-up': openSubjectId === subject.id,
             'bi-chevron-down': openSubjectId !== subject.id
           }"></i>
      </div>

      <div class="collapse"
           [ngClass]="{ show: openSubjectId === subject.id }">

        <ul class="list-group rounded-0 border-top border-warning">
          <li *ngFor="let pool of getFilteredTopicPools(subject)"
              class="list-group-item d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <span> {{ pool.name }} </span>
            </div>
            <div class="d-flex gap-3 align-items-center">

              <i class="bi bi-play-circle-fill fs-5"
                 [ngClass]="{
                   'text-warning': hasQuestions(pool.id),
                   'text-secondary opacity-50': !hasQuestions(pool.id)
                 }"
                 [style.cursor]="hasQuestions(pool.id) ? 'pointer' : 'not-allowed'"
                 [title]="hasQuestions(pool.id) ? 'Lernen starten' : 'Keine Fragen gefunden'"
                 (click)="navigateToTopicPool(pool)"></i>

              <i *ngIf="showPlusIcon()"
                 class="bi bi-plus-circle-fill text-success fs-5"
                 style="cursor: pointer"
                 (click)="navigateToFragenkonfigurator(subject,pool)"></i>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
