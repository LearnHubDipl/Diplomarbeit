<div class="card h-100 shadow-sm position-relative" (click)="closeMenu()">
  <img
    class="card-img-top"
    [src]="subject?.img?.path || '/assets/subject-default.jpg'"
    alt="{{ subject?.name || 'Fachbild' }}"
    style="object-fit:cover; aspect-ratio: 4/3;"
    onerror="this.onerror=null; this.src='/assets/subject-default.jpg';"
  />

  <div class="card-body d-flex align-items-start justify-content-between">
    <div>
      <h5 class="card-title mb-1">{{ subject.name }}</h5>
      <p class="card-text text-muted mb-0">{{ subject.description || '' }}</p>
    </div>

    <div
      class="dropdown ms-2"
      *ngIf="canManage"
      (click)="$event.stopPropagation()"
    >
      <button
        class="btn btn-outline-secondary btn-sm"
        (click)="toggleMenu($event)"
        aria-label="Optionen"
      >
        &#x22EE;
      </button>

      <ul
        class="dropdown-menu dropdown-menu-end show"
        *ngIf="menuOpen"
        style="position: absolute; inset: auto 0 0 auto; transform: translateY(-2px);"
      >
        <li>
          <a class="dropdown-item" href="#" (click)="onEdit($event)">Bearbeiten</a>
        </li>
        <li>
          <a class="dropdown-item text-danger" href="#" (click)="onDelete($event)">Löschen</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="card-footer bg-white">
    <a class="btn btn-dark w-100" [routerLink]="['/subjects', subject.id]">Öffnen</a>
  </div>
</div>
