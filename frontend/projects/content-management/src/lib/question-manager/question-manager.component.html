<!--von choose-study-topic component -->

<div class="container mt-5">
  <h2 class="fw-bold text-warning">Fragen bearbeiten/löschen</h2>
  <p class="text-muted">Wähle ein Fach und dann einen Themenpool um ausgewählte Fragen zu bearbeiten & löschen</p>
  <div id="accordionSubjects">
    <div *ngFor="let subject of subjects" class="mb-2 border rounded overflow-hidden">
      <div class="bg-warning text-white p-3 d-flex justify-content-between align-items-center"
           style="cursor: pointer;"
           (click)="toggleSubject(subject.id)">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-folder2-open fs-5 me-2"></i>
          <span class="fs-5">{{ subject.name }}</span>
        </div>
        <i class="bi fs-4" [ngClass]="{
             'bi-chevron-up': openSubjectId === subject.id,
             'bi-chevron-down': openSubjectId !== subject.id
           }"></i>
      </div>

      <div class="collapse"
           [ngClass]="{ show: openSubjectId === subject.id }">

        <ul class="list-group rounded-0 border-top border-warning">
          <li *ngFor="let pool of subject.topicPools" class="list-group-item flex-column p-2">
            <div class="d-flex justify-content-between align-items-center" style="cursor: pointer;"
                 (click)="togglePool(pool)">
              <span> {{ pool.name }} </span>
              <i class="bi fs-4"
                 [ngClass]="{'bi-chevron-up': openPoolId === pool.id,'bi-chevron-down': openPoolId != pool.id}"></i>
            </div>

            <ul *ngIf="openPoolId === pool.id" class="list-group mt-2">
              <li *ngFor="let questions of questionsByPool[pool.id] || []"
                  class="list-group-item d-flex justify-content-between align-items-center">
                <div> {{ getFirstCharacters(questions.text) }}</div>
                <div class="d-flex gap-2">
                  <i class="bi bi-trash-fill text-danger fs-5" style="cursor:pointer;"
                  (click)="deleteQuestion(questions, pool.id)"></i>
                  <i class="bi bi-pencil-fill text-success fs-5" style="cursor:pointer;"
                  (click)="editQuestion(questions)"></i>
                </div>
              </li>
              <li *ngIf="questionsByPool[pool.id]?.length === 0" class="list-group-item text-warning"> Keine Fragen
                vorhanden.
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
