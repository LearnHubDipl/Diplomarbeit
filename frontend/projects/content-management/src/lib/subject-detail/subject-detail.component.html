<div class="container py-3">
  <!-- BREADCRUMB -->
  <nav aria-label="breadcrumb" class="mb-3" style="--bs-breadcrumb-divider: '>';">
    <ol class="breadcrumb fs-5 fw-semibold">
      <!-- Fächer -->
      <li class="breadcrumb-item">
        <a routerLink="/subjects" class="text-dark text-decoration-none">
          <i class="bi bi-journal-bookmark me-1"></i>
          Fächer
        </a>
      </li>

      <!-- Fach -->
      <li class="breadcrumb-item" *ngIf="subject && subject.id">
        <a [routerLink]="['/subjects', subject.id]" class="text-dark text-decoration-none">
          {{ subject.name }}
        </a>
      </li>

      <!-- Pool (aktuell) -->
      <li class="breadcrumb-item active text-orange fw-bold"
          *ngIf="selectedPoolId"
          aria-current="page">
        {{ getPoolNameById(selectedPoolId) }}
      </li>
    </ol>
  </nav>



  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let p of pools; trackBy: trackPool"
        (click)="goToPoolAny(p)">
      <span>{{ p.name }}</span>
      <span class="btn-group btn-group-sm" (click)="$event.stopPropagation()">
        <!--
                  (click)="deleteQuestion(questions, pool.id)"></i>
                  (click)="editQuestion(questions)"></i>

            -->
             <div class="d-flex gap-2">
                  <i class="bi bi-trash-fill text-danger fs-5" style="cursor:pointer;"
                     (click)="deletePool(p, $event)"></i>
                  <i class="bi bi-pencil-fill text-success fs-5" style="cursor:pointer;"
                     (click)="renamePool(p, $event)"></i>
                </div>
      </span>
    </li>
  </ul>

  <div class="input-group mt-3">
    <input class="form-control" [(ngModel)]="newPoolName" placeholder="Neuen Themenpool..." />
    <button class="btn btn-primary" (click)="quickCreatePool()">➕ Hinzufügen</button>
  </div>
