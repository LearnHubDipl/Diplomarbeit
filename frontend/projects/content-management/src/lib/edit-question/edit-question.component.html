<div class="container py-5">
  <h1 class="fw-bold mb-1">Frage bearbeiten</h1>
  <p class="mb-4">Ändern Sie nur die erlaubten Felder: Frage, Antworten, Erklärung, öffentlich/privat.</p>

  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="type" class="form-label">Fragentyp</label>
      <select id="type" class="form-select border-warning" formControlName="type">
        <option value="" disabled>Bitte wählen</option>
        <option *ngFor="let type of QuestionType | keyvalue" [value]="type.value">{{ type.value }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="text" class="form-label">Frage *</label>
      <textarea id="text" class="form-control border-warning" rows="3" formControlName="text"
                [class.is-invalid]="questionForm.get('text')?.invalid && questionForm.get('text')?.touched">
      </textarea>
      <div class="invalid-feedback" *ngIf="questionForm.get('text')?.invalid && questionForm.get('text')?.touched">
        Bitte geben Sie eine Frage ein.
      </div>
    </div>

    <div *ngIf="questionForm.get('type')?.value === QuestionType.MULTIPLE_CHOICE" class="mb-3">
      <label class="form-label">Antwortmöglichkeiten *</label>
      <div formArrayName="answers">
        <div *ngFor="let answer of answersArray.controls; let i = index" [formGroupName]="i"
             class="mb-3 p-3 border rounded">
          <div class="row align-items-center">
            <div class="col-9">
              <input type="text" class="form-control" formControlName="text" [placeholder]="'Antwort ' + (i+1)"
                     [class.is-invalid]="answer.get('text')?.invalid && answer.get('text')?.touched">
              <div class="invalid-feedback" *ngIf="answer.get('text')?.invalid && answer.get('text')?.touched">
                Bitte geben Sie eine Antwort ein.
              </div>
            </div>
            <div class="col-3">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" formControlName="isCorrect" [id]="'correct-' + i">
                <label class="form-check-label" [for]="'correct-' + i">{{ answer.get('isCorrect')?.value ? 'Richtig' : 'Falsch' }}</label>
              </div>
              <button type="button" class="btn btn-sm btn-danger mt-1" (click)="removeAnswer(i)">Entfernen</button>
            </div>
          </div>
        </div>
      </div>
      <button *ngIf="answersArray.length < maxAnswers" type="button" class="btn btn-warning rounded-pill px-4 py-2 fw-semibold text-white"
              (click)="addAnswer()">+</button>
    </div>

    <div class="mb-3" *ngIf="questionForm.get('type')?.value === QuestionType.FREETEXT || questionForm.get('type')?.value === QuestionType.MULTIPLE_CHOICE">
      <label for="explanation" class="form-label">Erklärung / Musterlösung</label>
      <textarea id="explanation" class="form-control border-warning" rows="3" formControlName="explanation"></textarea>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="isPublic" formControlName="isPublic">
      <label class="form-check-label" for="isPublic">{{ questionForm.get('isPublic')?.value ? 'Öffentlich' : 'Privat' }}</label>
    </div>

    <button type="submit" class="btn btn-warning rounded-pill px-4 py-2 fw-semibold text-white" [disabled]="questionForm.invalid">
      Speichern
    </button>

    <button [routerLink]="'/manageQuestions'" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold ms-2">
      Zurück zur Übersicht
    </button>

      </form>
</div>
